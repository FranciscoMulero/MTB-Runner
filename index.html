<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTB Runner - FML</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
    
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start / Game Over Overlay -->
        <div class="overlay" id="menuOverlay">
            <h1 class="game-title" id="menuTitle">🚵 MTB RUNNER</h1>
            <p style="color: #a0aec0; font-size: 13px;" id="menuSubtitle">¡Supera los obstáculos de la montaña!</p>

            <div class="controls-grid">
                <div class="control-card">
                    <h4>💻 Ordenador</h4>
                    <div class="control-item"><span>Saltar</span> <span class="key">ESPACIO / ▲</span></div>
                    <div class="control-item"><span>Agacharse</span> <span class="key">▼ ABAJO</span></div>
                </div>
                <div class="control-card">
                    <h4>📱 Móvil / Tablet</h4>
                    <div class="control-item"><span>Saltar</span> <span class="key">Tocar Arriba</span></div>
                    <div class="control-item"><span>Agacharse</span> <span class="key">Tocar Abajo</span></div>
                </div>
            </div>

            <button class="btn-start" id="startBtn">INICIAR CARRERA</button>
        </div>

        <!-- Touch Controls for Mobile -->
        <div class="touch-controls">
            <div class="touch-btn" id="duckBtn">👇</div>
            <div class="touch-btn" id="jumpBtn">🚀</div>
        </div>
    </div>
    <p>&copy; Francisco Mulero López</p>
</body>
<script src="script.js"></script>
</html>
